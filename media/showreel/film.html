<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mailflare showreel</title>
<style>
@font-face { font-family: Inter; src: url("file:///Users/mac/Library/Fonts/Inter-Regular.ttf"); font-weight: 400; }
@font-face { font-family: Inter; src: url("file:///Users/mac/Library/Fonts/Inter-Medium.ttf"); font-weight: 500; }
@font-face { font-family: Inter; src: url("file:///Users/mac/Library/Fonts/Inter-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: Inter; src: url("file:///Users/mac/Library/Fonts/Inter-Bold.ttf"); font-weight: 700; }
@font-face { font-family: Inter; src: url("file:///Users/mac/Library/Fonts/Inter-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: Inter; src: url("file:///Users/mac/Library/Fonts/Inter-Black.ttf"); font-weight: 900; }

* { box-sizing: border-box; }
html, body {
	margin: 0;
	width: 1920px;
	height: 1080px;
	overflow: hidden;
	background: #05070c;
	font-family: Inter, system-ui, sans-serif;
	color: #12151c;
}
#world { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
#bg { position: absolute; inset: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(30px); }
#grid {
	position: absolute; inset: -10%;
	background-image:
		linear-gradient(rgba(140,170,220,0.05) 1px, transparent 1px),
		linear-gradient(90deg, rgba(140,170,220,0.05) 1px, transparent 1px);
	background-size: 88px 88px;
	mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 72%);
}
#vignette {
	position: absolute; inset: 0;
	background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%);
	pointer-events: none;
}
#stage { position: absolute; inset: 0; transform-origin: 50% 48%; }
.character {
	position: absolute;
	right: -20px;
	bottom: -90px;
	height: 1020px;
	z-index: 6;
	pointer-events: none;
	transform-origin: 60% 100%;
}
#shadow {
	position: absolute;
	right: 180px;
	bottom: 18px;
	width: 420px;
	height: 46px;
	border-radius: 50%;
	background: rgba(0,0,0,0.45);
	filter: blur(16px);
	z-index: 4;
}
#copy { position: absolute; left: 108px; top: 168px; width: 1040px; z-index: 7; }
.eyebrow {
	display: flex; align-items: center; gap: 14px;
	font-size: 15px; font-weight: 600; letter-spacing: 0.22em;
	color: #9db7ff; text-transform: uppercase;
}
.eyebrow .rule { width: 42px; height: 1px; background: #7ea2ff; }
#lines { margin-top: 28px; }
.line { display: block; font-weight: 750; font-weight: 800; letter-spacing: -0.045em; color: white; line-height: 0.96; }
.line span { display: inline-block; }
.w { display: inline-block; will-change: transform; }
#l1 { font-size: 92px; }
#l2 { font-size: 92px; margin-top: 6px; }
#l3 { font-size: 40px; margin-top: 22px; color: #b7c3d6; font-weight: 500; letter-spacing: -0.03em; }
.gmail {
	position: relative;
	display: inline-block;
	margin-left: 10px;
	padding: 2px 12px 4px;
	border-radius: 12px;
	background: rgba(255,255,255,0.06);
	color: #ffd0d4;
	font-weight: 650;
	font-weight: 600;
}
.gmail .strike {
	position: absolute; left: 8px; right: 8px; top: 54%;
	height: 3px; border-radius: 2px; background: #ff5d6c;
	transform: scaleX(0); transform-origin: left center;
}
#address {
	position: absolute;
	left: 108px;
	top: 620px;
	z-index: 8;
	display: flex;
	align-items: center;
	font-size: 64px;
	font-weight: 700;
	letter-spacing: -0.04em;
	color: white;
}
#address .local { color: white; }
#address .domain { color: #7eb0ff; }
#address .caret {
	width: 3px; height: 58px; margin-left: 4px;
	background: #7eb0ff; border-radius: 2px;
}
#glowring {
	position: absolute;
	left: 70px; top: 560px;
	width: 820px; height: 180px;
	border-radius: 40px;
	background: radial-gradient(ellipse at 30% 50%, rgba(47,124,246,0.45), transparent 70%);
	filter: blur(18px);
	z-index: 3;
}

#window {
	position: absolute;
	left: 72px;
	top: 128px;
	width: 1240px;
	height: 760px;
	border-radius: 28px;
	background: #f7f8fb;
	box-shadow:
		0 50px 100px rgba(0,0,0,0.45),
		0 0 0 1px rgba(255,255,255,0.14);
	overflow: hidden;
	z-index: 5;
	transform-origin: 50% 60%;
}
.chrome {
	height: 54px;
	display: flex; align-items: center; gap: 8px;
	padding: 0 18px;
	background: #fff;
	border-bottom: 1px solid #e6eaf1;
}
.dot { width: 11px; height: 11px; border-radius: 50%; }
.chrome .title {
	margin-left: 14px;
	font-size: 13px; font-weight: 600; color: #8b95a7; letter-spacing: 0.01em;
}
.chip-addr {
	margin-left: auto;
	font-size: 13px; font-weight: 650; font-weight: 600;
	color: #0b57d0;
	background: #e8f0fe;
	padding: 6px 12px;
	border-radius: 999px;
}
.body { display: flex; height: 706px; }
.side {
	width: 228px;
	background: #f3f6fb;
	border-right: 1px solid #e6eaf1;
	padding: 18px 12px;
}
.compose {
	height: 42px; border-radius: 12px;
	background: #0b57d0; color: white;
	font-weight: 650; font-weight: 600; font-size: 14px;
	display: flex; align-items: center; justify-content: center; gap: 8px;
	box-shadow: 0 8px 16px rgba(11,87,208,0.25);
}
.nav { margin-top: 16px; display: flex; flex-direction: column; gap: 4px; }
.nav .item {
	height: 38px; border-radius: 10px;
	display: flex; align-items: center; gap: 10px;
	padding: 0 12px;
	font-size: 14px; color: #3c4658; font-weight: 500;
}
.nav .item.on { background: #e7f0ff; color: #0b57d0; font-weight: 650; font-weight: 600; }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 700; color: #0b57d0; }
.nav .ico { width: 8px; height: 8px; border-radius: 50%; background: #c5ceda; }
.nav .item.on .ico { background: #0b57d0; }
.main { flex: 1; padding: 16px 18px 18px; position: relative; }
.search {
	height: 44px; border-radius: 12px;
	background: #eef2f8;
	display: flex; align-items: center; gap: 10px;
	padding: 0 14px;
	color: #5c6b82; font-size: 15px;
}
.search .lens {
	width: 14px; height: 14px; border: 2px solid #8aa; border-radius: 50%; position: relative;
}
.search .lens:after {
	content: ""; position: absolute; width: 6px; height: 2px; background: #8aa;
	right: -5px; bottom: -2px; transform: rotate(40deg);
}
.search b { color: #12151c; font-weight: 600; }
.rows { margin-top: 12px; }
.row {
	height: 78px;
	display: grid;
	grid-template-columns: 44px 1fr auto;
	gap: 12px;
	align-items: center;
	border-bottom: 1px solid #eef1f6;
	position: relative;
}
.row .av {
	width: 40px; height: 40px; border-radius: 50%;
	display: grid; place-items: center;
	color: white; font-weight: 700; font-size: 13px;
}
.row .who { font-weight: 700; font-size: 15px; color: #161a22; }
.row .sub { font-size: 13.5px; color: #2a3344; font-weight: 600; margin-top: 1px; }
.row .pre { font-size: 12.5px; color: #8b95a7; margin-top: 2px; }
.row .when { font-size: 12px; color: #8b95a7; font-weight: 500; }
.row .unread {
	position: absolute; right: 4px; bottom: 16px;
	width: 8px; height: 8px; border-radius: 50%; background: #0b57d0;
}
.row.hot { background: linear-gradient(90deg, #eef4ff, transparent 80%); border-radius: 12px; }
#toast {
	position: absolute;
	right: 28px; top: 118px;
	background: #12151c; color: white;
	border-radius: 14px;
	padding: 10px 14px;
	font-size: 13px;
	box-shadow: 0 16px 40px rgba(0,0,0,0.28);
	z-index: 6;
	display: flex; align-items: center; gap: 8px;
}
#toast i { width: 8px; height: 8px; border-radius: 50%; background: #3d8bff; display: block; }
#cursor {
	position: absolute; z-index: 9; width: 18px; height: 18px;
}
#pane-mail, #pane-domain { position: absolute; left: 246px; right: 0; top: 54px; bottom: 0; padding: 16px 18px 18px; }
#pane-domain { padding: 8px 8px 16px; }

.node {
	position: absolute;
	min-width: 168px;
	background: white;
	border-radius: 16px;
	padding: 12px 14px 12px 12px;
	box-shadow: 0 16px 40px rgba(20,40,80,0.12), 0 0 0 1px rgba(20,40,80,0.06);
	display: flex; align-items: center; gap: 10px;
}
.node .av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: white; font-weight: 700; }
.node b { display: block; font-size: 18px; letter-spacing: -0.03em; }
.node em { font-style: normal; font-size: 12px; color: #6d7b90; font-weight: 600; }
#hub {
	position: absolute;
	left: 430px; top: 250px;
	width: 230px; height: 92px;
	border-radius: 22px;
	background: #0e1420;
	color: white;
	display: flex; align-items: center; gap: 12px;
	padding: 0 16px;
	box-shadow: 0 20px 50px rgba(11,87,208,0.35);
}
#hub .mark { width: 46px; height: 46px; }
#hub .name { font-weight: 700; font-size: 16px; letter-spacing: -0.03em; }
#hub .sub { font-size: 12px; color: #9eb0cc; }
#wires { position: absolute; inset: 0; width: 100%; height: 100%; }
.checks { position: absolute; right: 22px; top: 78px; display: flex; flex-direction: column; gap: 8px; }
.check {
	width: 176px; height: 36px; border-radius: 10px;
	background: white;
	box-shadow: 0 0 0 1px #e6eaf1;
	display: flex; align-items: center; gap: 8px;
	padding: 0 10px;
	font-size: 13px; font-weight: 600; color: #1c2430;
}
.check .box {
	width: 16px; height: 16px; border-radius: 5px; background: #0b57d0;
	color: white; font-size: 11px; display: grid; place-items: center;
}
#pills {
	position: absolute; left: 36px; bottom: 18px;
	display: flex; gap: 8px;
}
.pill {
	padding: 7px 12px; border-radius: 999px;
	background: #eef3fb; color: #3c4d6b;
	font-size: 12px; font-weight: 650; font-weight: 600;
}
.pill.on { background: #0b57d0; color: white; }
#setup {
	position: absolute; left: 36px; top: 22px;
	font-size: 12px; font-weight: 650; font-weight: 600;
	color: #0b57d0; background: #e7f0fe;
	padding: 6px 10px; border-radius: 999px;
}

#finale {
	position: absolute; inset: 0;
	display: flex; align-items: center; justify-content: center;
	z-index: 8;
}
#finale .giant {
	position: absolute;
	font-size: 112px; font-weight: 800; letter-spacing: -0.05em;
	color: white; text-align: center;
}
#lockup {
	position: absolute;
	display: flex; flex-direction: column; align-items: center;
	text-align: center;
}
#lockup .mark { width: 92px; height: 92px; filter: drop-shadow(0 16px 30px rgba(47,124,246,0.45)); }
#lockup h1 {
	position: relative;
	margin: 22px 0 0;
	font-size: 92px; font-weight: 800; letter-spacing: -0.055em;
	color: white; line-height: 1;
	overflow: hidden;
}
#lockup .tag {
	margin-top: 16px;
	font-size: 28px; font-weight: 500; color: #c5d0e2; letter-spacing: -0.02em;
}
#lockup .url {
	margin-top: 22px;
	font-size: 18px; font-weight: 600; color: #dce7ff;
	border: 1px solid rgba(255,255,255,0.18);
	background: rgba(255,255,255,0.06);
	padding: 8px 16px; border-radius: 999px;
}
#sweep {
	position: absolute; top: 0; bottom: 0; left: 0; width: 90px;
	background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
	pointer-events: none;
}
#grain {
	position: absolute; inset: -20%;
	pointer-events: none;
	opacity: 0.18;
	mix-blend-mode: overlay;
	background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
}
</style>
</head>
<body>
<div id="world">
	<div id="bg">
		<div class="orb" id="orbA"></div>
		<div class="orb" id="orbB"></div>
		<div id="grid"></div>
	</div>
	<div id="stage">
		<div id="shadow"></div>
		<img class="character" id="charA" alt="" src="assets/character-a.png" />
		<img class="character" id="charB" alt="" src="assets/character-b.png" />
		<img class="character" id="charC" alt="" src="assets/character-c.png" />

		<div id="copy">
			<div class="eyebrow" id="eyebrow"><span class="rule"></span>Mailflare</div>
			<div id="lines">
				<div class="line" id="l1"></div>
				<div class="line" id="l2"></div>
				<div class="line" id="l3"></div>
			</div>
		</div>
		<div id="glowring"></div>
		<div id="address"><span id="addrText"></span><span class="caret" id="caret"></span></div>

		<div id="window">
			<div class="chrome">
				<span class="dot" style="background:#ff5f57"></span>
				<span class="dot" style="background:#febc2e"></span>
				<span class="dot" style="background:#28c840"></span>
				<span class="title" id="winTitle">mailflare · inbox</span>
				<span class="chip-addr" id="winChip">hello@mailflare.co</span>
			</div>
			<div class="body">
				<div class="side">
					<div class="compose" id="compose">＋ &nbsp;Compose</div>
					<div class="nav" id="nav"></div>
				</div>
			</div>
			<div id="pane-mail">
				<div class="search" id="searchbox"><span class="lens"></span><span id="query">Search mail</span></div>
				<div class="rows" id="rows"></div>
			</div>
			<div id="pane-domain">
				<div id="setup">Live in minutes · no mail server</div>
				<svg id="wires"></svg>
				<div id="hub">
					<img class="mark" src="assets/icon.png" alt="" />
					<div><div class="name">mailflare.co</div><div class="sub">Custom domain</div></div>
				</div>
				<div id="nodes"></div>
				<div class="checks" id="checks"></div>
				<div id="pills"></div>
			</div>
			<div id="toast"><i></i><span>New message · hello@mailflare.co</span></div>
			<div id="cursor"></div>
		</div>

		<div id="finale">
			<div class="giant" id="g1">Your domain.</div>
			<div class="giant" id="g2">Your email.</div>
			<div id="lockup">
				<img class="mark" id="endMark" src="assets/icon.png" alt="" />
				<h1 id="word">Mailflare<div id="sweep"></div></h1>
				<div class="tag">Professional email for individuals and teams.</div>
				<div class="url">mailflare.co</div>
			</div>
		</div>
	</div>
	<div id="vignette"></div>
	<div id="grain"></div>
</div>
<script>
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const ease = (p) => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
const back = (p) => {
	p = clamp(p, 0, 1);
	const c1 = 1.35, c3 = c1 + 1;
	return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
};
const L1 = 0.28, L2 = 3.63, L3 = 6.57, L4 = 11.11;

const $ = (id) => document.getElementById(id);

const words = [
	["Your", L1 + 0.094], ["business", L1 + 0.212],
	["deserves", L1 + 0.613], ["better", L1 + 1.061],
];
$("l1").innerHTML = words.slice(0, 2).map(([w, t]) => `<span class="w" data-t="${t}">${w}</span>`).join(" ");
$("l2").innerHTML = words.slice(2).map(([w, t]) => `<span class="w" data-t="${t}">${w}</span>`).join(" ");
$("l3").innerHTML = `
	<span class="w" data-t="${L1 + 1.38}">than</span>
	<span class="w" data-t="${L1 + 1.521}">an</span>
	<span class="gmail w" data-t="${L1 + 1.60}" id="gmail">@gmail.com<i class="strike" id="strike"></i></span>
`;

const nav = [
	["Inbox", "4", true],
	["Starred", "", false],
	["Sent", "", false],
	["Drafts", "2", false],
	["Spam", "", false],
	["Archive", "", false],
];
$("nav").innerHTML = nav.map(([n, c, on]) =>
	`<div class="item${on ? " on" : ""}" data-nav="${n}"><span class="ico"></span>${n}${c ? `<span class="count">${c}</span>` : ""}</div>`
).join("");

const messages = [
	["MC", "#5b8def", "Maya Chen", "Product launch tomorrow", "Can we share the final update?", "9:41 AM", true],
	["NL", "#14b8c9", "Northline", "Your domain is connected", "Mail is ready on your domain.", "8:12 AM", false],
	["TP", "#e0a15a", "Theo Park", "One more thing", "Thanks for the thoughtful note.", "Yesterday", false],
	["SN", "#a78bfa", "Studio Notes", "A fresh start for Monday", "Ideas worth opening.", "Mon", false],
];
function rowHTML(m, hot) {
	return `<div class="row${hot ? " hot" : ""}">
		<div class="av" style="background:${m[1]}">${m[0]}</div>
		<div><div class="who">${m[2]}</div><div class="sub">${m[3]}</div><div class="pre">${m[4]}</div></div>
		<div class="when">${m[5]}</div>
		${m[6] ? `<span class="unread"></span>` : ""}
	</div>`;
}
$("rows").innerHTML = messages.map((m, i) => rowHTML(m, i === 0)).join("");

const nodes = [
	["hello@", "Mailbox", "#0b57d0", "H", 36, 150, L3 + 0.39],
	["support@", "Alias", "#14b8c9", "S", 430, 78, L3 + 1.51],
	["hieu@", "Member", "#e0a15a", "H", 36, 400, L3 + 2.15],
	["team@", "Team", "#7c6cf0", "T", 430, 400, L3 + 3.11],
];
$("nodes").innerHTML = nodes.map((n, i) =>
	`<div class="node" id="node${i}" style="left:${n[4]}px;top:${n[5]}px">
		<div class="av" style="background:${n[2]}">${n[3]}</div>
		<div><b>${n[0]}</b><em>${n[1]}</em></div>
	</div>`
).join("");

const checks = ["Users", "Aliases", "Domains", "Permissions"];
$("checks").innerHTML = checks.map((c, i) =>
	`<div class="check" id="check${i}"><span class="box">✓</span>${c}</div>`
).join("");
$("pills").innerHTML = ["Individuals", "Startups", "Teams"].map((p, i) =>
	`<span class="pill${i === 2 ? " on" : ""}" id="pill${i}">${p}</span>`
).join("");

const ADDR = "hello@mailflare.co";
const cursor = $("cursor");
cursor.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 1.5l4.2 13.2 2.2-5.1 5.3-1.2z" fill="#12151c" stroke="#fff" stroke-width="1"/></svg>`;

function show(el, o, tf, blur) {
	el.style.opacity = o;
	if (tf != null) el.style.transform = tf;
	el.style.filter = blur > 0.2 ? `blur(${blur}px)` : "none";
}

function wordPop(el, t) {
	const at = Number(el.dataset.t);
	const p = back(seg(t, at, at + 0.38));
	const o = ease(seg(t, at, at + 0.16));
	el.style.opacity = o;
	el.style.transform = `translateY(${lerp(28, 0, p)}px)`;
	el.style.filter = `blur(${lerp(6, 0, ease(seg(t, at, at + 0.22)))}px)`;
}

window.seek = function (t) {
	const bg = `radial-gradient(900px 620px at ${50 + Math.sin(t * 0.7) * 8}% 42%, #17315f 0%, #0a1020 46%, #05070c 100%)`;
	$("bg").style.background = bg;
	$("orbA").style.cssText = `left:${280 + Math.sin(t) * 30}px;top:${80 + Math.cos(t * 0.8) * 20}px;width:520px;height:520px;background:rgba(47,110,246,${0.28 + 0.06 * Math.sin(t)});`;
	$("orbB").style.cssText = `right:80px;bottom:-40px;width:420px;height:420px;background:rgba(20,180,200,0.16);`;
	$("grid").style.transform = `translate(${-(t * 18) % 88}px, ${(t * 8) % 88}px)`;

	let camS = lerp(1.05, 1, ease(seg(t, 0, 2.4)));
	let camX = 0;
	if (t > 3.3 && t < 6.7) camS = lerp(1.02, 1, ease(seg(t, 3.3, 4)));
	if (t >= 6.5 && t < 10.9) camS = lerp(1, 1.035, ease(seg(t, 6.5, 7.3)));
	if (t >= 10.7) {
		const p = ease(seg(t, 10.7, 11.5));
		camS = lerp(1.035, 0.98, p);
		camS = lerp(camS, 1, ease(seg(t, 11.6, 12.6)));
	}
	$("stage").style.transform = `translate(${camX}px,0) scale(${camS})`;

	const enter = back(seg(t, 0.08, 0.7));
	const poseB = ease(seg(t, 3.35, 3.7));
	const poseC = ease(seg(t, 10.85, 11.25));
	const charOut = ease(seg(t, 12.15, 12.7));
	const bob = Math.sin(t * 2.2) * 6;
	const base = `translateY(${lerp(70, bob, enter)}px) scale(${lerp(0.94, 1, enter)})`;
	show($("charA"), (1 - poseB) * enter * (1 - charOut), base, (1 - enter) * 10 + poseB * 8);
	show($("charB"), poseB * (1 - poseC) * (1 - charOut), `translateX(${lerp(40, 0, poseB)}px) translateY(${bob}px) scale(${lerp(1.04, 0.96, poseB)})`, (1 - poseB) * 8 + poseC * 8);
	show($("charC"), poseC * (1 - charOut), `translateY(${lerp(30, bob, poseC)}px) scale(${lerp(0.9, 0.86, poseC)})`, (1 - poseC) * 8);
	$("shadow").style.opacity = String(0.55 * enter * (1 - charOut));
	$("shadow").style.transform = `scale(${lerp(0.8, 1, enter)})`;

	const copyOut = ease(seg(t, 3.25, 3.7));
	$("copy").style.opacity = String((1 - copyOut) * ease(seg(t, 0.15, 0.4)));
	$("copy").style.transform = `translateY(${lerp(16, 0, ease(seg(t, 0.15, 0.6)))}px)`;
	$("copy").style.filter = copyOut ? `blur(${copyOut * 8}px)` : "none";
	document.querySelectorAll(".w").forEach((el) => wordPop(el, t));
	const strike = ease(seg(t, L1 + 1.9, L1 + 2.35));
	$("strike").style.transform = `scaleX(${strike})`;
	$("gmail").style.color = strike > 0.6 ? "#8d97a8" : "#ffd0d4";

	const addrIn = ease(seg(t, 2.28, 2.7));
	const addrOut = ease(seg(t, 3.3, 3.65));
	const n = Math.round(lerp(0, ADDR.length, ease(seg(t, 2.32, 2.95))));
	const typed = ADDR.slice(0, n);
	const at = typed.indexOf("@");
	$("addrText").innerHTML = at < 0
		? `<span class="local">${typed}</span>`
		: `<span class="local">${typed.slice(0, at)}</span><span class="domain">${typed.slice(at)}</span>`;
	show($("address"), addrIn * (1 - addrOut), `translateY(${lerp(24, 0, back(seg(t, 2.28, 2.75)))}px)`, addrOut * 6);
	$("caret").style.opacity = n < ADDR.length ? String(0.3 + 0.7 * Math.abs(Math.sin(t * 10))) : "0";
	$("glowring").style.opacity = String(0.9 * addrIn * (1 - addrOut));

	const winIn = back(seg(t, 3.45, 4.05));
	const winOut = ease(seg(t, 10.75, 11.45));
	show($("window"), winIn * (1 - winOut), `translateY(${lerp(80, 0, winIn)}px) rotateX(${lerp(14, 0, winIn)}deg) scale(${lerp(0.94, 1, winIn) * lerp(1, 0.72, winOut)})`, winOut * 10);
	$("window").style.transformOrigin = "50% 40%";

	const domain = ease(seg(t, 6.5, 6.95));
	$("pane-mail").style.opacity = String(1 - domain);
	$("pane-mail").style.transform = `translateY(${domain * -12}px)`;
	$("pane-domain").style.opacity = String(domain);
	$("pane-domain").style.transform = `translateY(${(1 - domain) * 16}px)`;
	$("winTitle").textContent = domain > 0.5 ? "mailflare · workspace" : "mailflare · inbox";
	$("winChip").style.opacity = String(ease(seg(t, 3.7, 4.0)));

	const q = "is:unread";
	const qn = Math.round(lerp(0, q.length, ease(seg(t, 4.15, 5.05))));
	$("query").innerHTML = qn === 0 ? "Search mail" : `<b>${q.slice(0, qn)}</b>`;
	$("searchbox").style.boxShadow = qn ? "0 0 0 2px rgba(11,87,208,0.55)" : "none";

	const rows = [...$("rows").children];
	rows.forEach((row, i) => {
		const at = 3.85 + i * 0.12;
		const p = back(seg(t, at, at + 0.4));
		row.style.opacity = String(ease(seg(t, at, at + 0.2)));
		row.style.transform = `translateX(${lerp(36, 0, p)}px)`;
	});
	const count = $("nav").querySelector('[data-nav="Inbox"] .count');
	if (t > 5.15) count.textContent = "5";

	const toastP = ease(seg(t, 5.05, 5.35)) * (1 - ease(seg(t, 6.15, 6.45)));
	show($("toast"), toastP, `translateY(${lerp(-16, 0, back(seg(t, 5.05, 5.45)))}px)`, 0);

	const spots = [[250, 250], [430, 210], [560, 150], [300, 360]];
	const cursorPhase = t < 4.3 ? 0 : t < 4.9 ? 1 : t < 5.5 ? 2 : 3;
	const cp = ease(seg(t, [4.2, 4.55, 5.0, 5.6][cursorPhase], [4.5, 4.9, 5.35, 6.1][cursorPhase]));
	const prev = spots[Math.max(0, cursorPhase - 1)];
	const next = spots[cursorPhase];
	const cx = lerp(prev[0], next[0], cursorPhase === 0 ? 1 : cp);
	const cy = lerp(prev[1], next[1], cursorPhase === 0 ? 1 : cp);
	$("cursor").style.opacity = String(ease(seg(t, 4.15, 4.4)) * (1 - domain));
	$("cursor").style.transform = `translate(${cx}px, ${cy}px)`;

	nodes.forEach((n, i) => {
		const p = back(seg(t, n[6], n[6] + 0.45));
		const el = $("node" + i);
		el.style.opacity = String(ease(seg(t, n[6], n[6] + 0.2)) * domain);
		el.style.transform = `translateY(${lerp(22, 0, p)}px) scale(${lerp(0.86, 1, p)})`;
	});
	const hubP = back(seg(t, L3 + 0.05, L3 + 0.45));
	$("hub").style.opacity = String(ease(seg(t, L3 + 0.05, L3 + 0.25)) * domain);
	$("hub").style.transform = `scale(${lerp(0.8, 1, hubP)})`;

	const svg = $("wires");
	const hub = { x: 545, y: 296 };
	const anchors = [[150, 190], [540, 130], [150, 440], [540, 440]];
	svg.innerHTML = anchors.map((a, i) => {
		const p = ease(seg(t, nodes[i][6], nodes[i][6] + 0.4));
		return `<line x1="${hub.x}" y1="${hub.y}" x2="${lerp(hub.x, a[0], p)}" y2="${lerp(hub.y, a[1], p)}" stroke="rgba(11,87,208,0.35)" stroke-width="2" />`;
	}).join("");

	checks.forEach((c, i) => {
		const at = L3 + 2.45 + i * 0.16;
		const p = back(seg(t, at, at + 0.36));
		const el = $("check" + i);
		el.style.opacity = String(ease(seg(t, at, at + 0.16)));
		el.style.transform = `translateX(${lerp(24, 0, p)}px)`;
	});
	$("setup").style.opacity = String(ease(seg(t, L3 + 0.2, L3 + 0.5)));
	["pill0", "pill1", "pill2"].forEach((id, i) => {
		const at = L3 + 3.35 + i * 0.12;
		const p = back(seg(t, at, at + 0.34));
		const el = $(id);
		el.style.opacity = String(ease(seg(t, at, at + 0.16)));
		el.style.transform = `translateY(${lerp(10, 0, p)}px)`;
	});

	const navItems = [...$("nav").children];
	navItems.forEach((item, i) => {
		const at = 3.6 + i * 0.06;
		const p = back(seg(t, at, at + 0.32));
		item.style.opacity = String(ease(seg(t, at, at + 0.16)));
		item.style.transform = `translateX(${lerp(-16, 0, p)}px)`;
	});
	$("compose").style.opacity = String(ease(seg(t, 3.55, 3.8)));
	$("compose").style.transform = `scale(${lerp(0.9, 1, back(seg(t, 3.55, 3.95)))})`;

	const g1 = ease(seg(t, 11.2, 11.45)) * (1 - ease(seg(t, 12.05, 12.35)));
	const g2 = ease(seg(t, 12.15, 12.4)) * (1 - ease(seg(t, 12.9, 13.15)));
	show($("g1"), g1, `translateY(${lerp(30, 0, back(seg(t, 11.2, 11.6)))}px) scale(${lerp(1.08, 1, ease(seg(t, 11.2, 11.7)))})`, (1 - g1) * 8);
	show($("g2"), g2, `translateY(${lerp(30, 0, back(seg(t, 12.15, 12.55)))}px)`, (1 - g2) * 8);

	const lock = ease(seg(t, 12.95, 13.25));
	const lockP = back(seg(t, 12.95, 13.5));
	$("lockup").style.opacity = String(lock);
	$("lockup").style.transform = `scale(${lerp(0.92, 1, lockP)})`;
	$("endMark").style.transform = `scale(${lerp(0.4, 1, back(seg(t, 12.9, 13.35)))})`;
	$("endMark").style.transformOrigin = "50% 50%";
	const track = lerp(0.18, -0.055, ease(seg(t, 12.98, 13.45)));
	$("word").style.letterSpacing = track + "em";
	$("word").style.opacity = String(ease(seg(t, 13.0, 13.28)));
	$("lockup").querySelector(".tag").style.opacity = String(ease(seg(t, 13.4, 13.75)));
	$("lockup").querySelector(".tag").style.transform = `translateY(${lerp(10, 0, ease(seg(t, 13.4, 13.8)))}px)`;
	$("lockup").querySelector(".url").style.opacity = String(ease(seg(t, 13.75, 14.1)));
	$("lockup").querySelector(".url").style.transform = `translateY(${lerp(8, 0, ease(seg(t, 13.75, 14.15)))}px)`;
	const sweep = seg(t, 13.45, 14.15);
	$("sweep").style.opacity = String(sweep > 0 && sweep < 1 ? 0.9 : 0);
	$("sweep").style.transform = `translateX(${lerp(-80, 460, sweep)}px)`;
};

window.seek(0);
</script>
</body>
</html>
