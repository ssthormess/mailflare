name: Upstream Sync

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'hieunc229/mailflare' }}
  CUSTOM_BRANCH: ${{ vars.CUSTOM_BRANCH || 'better-mail' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mailflare-upstream-sync"
          git config user.email "mailflare-upstream-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "${upstream_url}"
          else
            git remote add upstream "${upstream_url}"
          fi
          git fetch --no-tags upstream
          git fetch --no-tags origin "+refs/heads/${CUSTOM_BRANCH}:refs/remotes/origin/${CUSTOM_BRANCH}" || true

      - name: Sync main from upstream (fast-forward only)
        run: |
          set -euo pipefail
          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          if [ -z "${upstream_branch}" ]; then
            echo "::error::Could not resolve the default branch of ${UPSTREAM_REPOSITORY}."
            exit 1
          fi
          upstream_ref="upstream/${upstream_branch}"
          echo "upstream_ref=${upstream_ref}" >> "${GITHUB_ENV}"

          if git merge-base --is-ancestor "${upstream_ref}" HEAD; then
            echo "main already up to date."
          elif git merge-base --is-ancestor HEAD "${upstream_ref}"; then
            echo "Fast-forwarding main to ${upstream_ref}."
            git merge --ff-only "${upstream_ref}"
            git push origin "HEAD:main"
          else
            echo "::error::origin/main has diverged from upstream and cannot fast-forward. main must stay a pure upstream mirror; fix manually."
            exit 1
          fi

      - name: Merge main into custom branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git rev-parse --verify --quiet "origin/${CUSTOM_BRANCH}" >/dev/null; then
            echo "${CUSTOM_BRANCH} does not exist; skipping."
            exit 0
          fi
          git checkout -B "${CUSTOM_BRANCH}" "origin/${CUSTOM_BRANCH}"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "${CUSTOM_BRANCH} already contains main."
            exit 0
          fi
          if git merge --no-edit origin/main; then
            echo "Merged main into ${CUSTOM_BRANCH}."
            git push origin "HEAD:${CUSTOM_BRANCH}"
          else
            git merge --abort || true
            echo "::error::origin/main conflicts with ${CUSTOM_BRANCH}. Resolve the merge manually; no custom changes were discarded."
            exit 1
          fi
